<!DOCTYPE html>
<html>
<head>
  <title>Top Up FF Murah</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #000000, #1a1a1a, #ff3c00);
      color: white;
      text-align: center;
    }

    .container {
      margin-top: 30px;
    }

    .box {
      background: rgba(0,0,0,0.8);
      margin: 20px;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 0 20px red;
    }

    h1 {
      color: orange;
      text-shadow: 0 0 10px red;
    }

    input {
      width: 80%;
      padding: 10px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    .diamond-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .diamond {
      width: 40%;
      margin: 10px;
      padding: 15px;
      background: linear-gradient(135deg, #111, #333);
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 0 10px orange;
      transition: 0.3s;
    }

    .diamond:hover {
      background: orange;
      color: black;
    }

    .diamond.active {
      border: 2px solid red;
      background: orange;
      color: black;
    }

    .diamond h3 {
      margin: 5px;
      color: cyan;
    }

    .diamond p {
      margin: 5px;
      color: orange;
    }

    button {
      padding: 12px 20px;
      background: orange;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      color: black;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 0 10px orange;
    }

    button:hover {
      background: red;
      color: white;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="box">
    <h1>🔥 TOP UP FF MURAH 🔥</h1>

    <input type="text" id="id" placeholder="Masukkan ID Free Fire"><br>

    <div class="diamond-list">

      <div class="diamond" onclick="pilih(this, '5 Diamond - Rp1.000')">
        <h3>5 💎</h3>
        <p>Rp1.000</p>
      </div>

      <div class="diamond" onclick="pilih(this, '12 Diamond - Rp2.000')">
        <h3>12 💎</h3>
        <p>Rp2.000</p>
      </div>

      <div class="diamond" onclick="pilih(this, '50 Diamond - Rp7.000')">
        <h3>50 💎</h3>
        <p>Rp7.000</p>
      </div>

      <div class="diamond" onclick="pilih(this, '70 Diamond - Rp10.000')">
        <h3>70 💎</h3>
        <p>Rp10.000</p>
      </div>

      <div class="diamond" onclick="pilih(this, '100 Diamond - Rp14.000')">
        <h3>100 💎</h3>
        <p>Rp14.000</p>
      </div>

      <div class="diamond" onclick="pilih(this, '140 Diamond - Rp20.000')">
        <h3>140 💎</h3>
        <p>Rp20.000</p>
      </div>

      <div class="diamond" onclick="pilih(this, '355 Diamond - Rp50.000')">
        <h3>355 💎</h3>
        <p>Rp50.000</p>
      </div>

      <div class="diamond" onclick="pilih(this, '720 Diamond - Rp100.000')">
        <h3>720 💎</h3>
        <p>Rp100.000</p>
      </div>

    </div>

    <button onclick="kirim()">Top Up Sekarang</button>
  </div>
</div>

<script>
var pilihan = "";

function pilih(el, paket) {
  var items = document.querySelectorAll(".diamond");
  items.forEach(i => i.classList.remove("active"));

  el.classList.add("active");
  pilihan = paket;
}

function kirim() {
  var id = document.getElementById("id").value;

  if (id == "") {
    alert("Masukkan ID dulu!");
    return;
  }

  if (pilihan == "") {
    alert("Pilih diamond dulu!");
    return;
  }

  var pesan = "Halo, saya mau top up Free Fire\n" +
              "ID: " + id + "\n" +
              "Paket: " + pilihan;

  var url = "https://wa.me/6288294078354?text=" + encodeURIComponent(pesan);

  window.open(url, "_blank");
}
</script>

</body>
</html>
